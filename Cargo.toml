[package]
name = "busapp"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dfui = { path = "../dfui" }
dfui-map = { path = "../dfui/map" }
futures-channel = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"

[package.metadata.android]
package = "at.busapp.innsbruck"
build_targets = ["aarch64-linux-android"]
# Icon foreground rendered from assets/icon.svg: rsvg-convert -w 432 -h 432.
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Innsbruck Bus"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[profile.dev.package."*"]
opt-level = 3
